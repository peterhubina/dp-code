# @package _global_
# ER binary prediction, arm 2 of 3: WSI + RNA gated fusion, WSI branch frozen.
#
#   replaces : bash tools/train_er_ablation.sh rna
#   run with : dp-train experiment=er_wsi_rna_gated
#   writes   : ${paths.results_root}/er/er_wsi_rna_gated_s1/
#   needs    : experiment=er_wsi_alone at the same clam.seed, already trained
#
# This is the arm behind the ER thread's positive result: RNA fusion beats H&E
# alone by +0.044 AUROC (DeLong p = 1.6e-5), and discrimination transports to
# CPTAC. Unlike the PAM50 case, RNA is not the source of the ER label, so this
# comparison is not circular.
#
# `pretrained_wsi_ckpt` interpolates `clam.seed`, reproducing the wrapper's
# `WSI_CKPT="${RESULTS_DIR}/er_wsi_alone_s${SEED}/…"`: `clam.seed=2` picks up
# seed 2's own frozen checkpoints, which is what makes the multi-seed repeat a
# full pipeline re-initialisation rather than a fusion-head one. `{fold}` is
# expanded by CLAM per fold.
#
# Instance clustering OFF here (`no_inst_cluster: true`) while arm 1 leaves it on
# — as in the wrapper. It is inert on the multimodal path anyway; it is recorded
# because it is what ran.

defaults:
  - override /fusion: gated

run:
  name: er_wsi_rna_gated

clam:
  # data and task
  task: tcga_brca_er
  embed_dim: 1536
  results_dir: ${paths.results_root}/er

  # identity
  exp_code: er_wsi_rna_gated

  # optimisation
  max_epochs: 50
  k: 10
  seed: 1
  early_stopping: true
  patience: 5
  weighted_sample: true
  log_data: true
  drop_out: 0.5
  opt: adam
  lr: 1e-4
  reg: 2.5e-6

  # model
  model_type: clam_mb
  model_size: big
  B: 4
  bag_loss: ce
  no_inst_cluster: true

  # second modality: the ER RNA table, top-10,000 features by training-fold variance
  tabular_csv: ${paths.rna_legacy_dir}/tcga_brca_er_rna_clam.csv.gz
  tabular_case_id_col: case_id
  tabular_hidden_dim: 256
  tabular_num_layers: 2
  tabular_top_n_features: 10000
  fusion_hidden_dim: 32

  # frozen WSI branch, from arm 1 at this seed
  pretrained_wsi_ckpt: ${paths.results_root}/er/er_wsi_alone_s${clam.seed}/s_{fold}_checkpoint.pt
  freeze_wsi_branch: true

  # tracking (CLAM's own flags)
  wandb: true
  wandb_project: er-brca-ablation
  wandb_tags: [er, wsi-rna, gated, frozen]
