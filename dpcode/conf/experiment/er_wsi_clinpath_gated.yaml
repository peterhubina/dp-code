# @package _global_
# ER binary prediction, arm 3 of 3: WSI + clinicopathological gated fusion,
# WSI branch frozen.
#
#   replaces : bash tools/train_er_ablation.sh clinpath
#   run with : dp-train experiment=er_wsi_clinpath_gated
#   writes   : ${paths.results_root}/er/er_wsi_clinpath_gated_s1/
#   needs    : experiment=er_wsi_alone at the same clam.seed, already trained
#
# The control that makes arm 2 interpretable: clinicopathological fusion does NOT
# beat H&E alone (−0.002 AUROC), so the RNA gain is not "any second modality
# helps". Reporting arm 2 without this arm would be the selective reporting the
# literature survey criticises.
#
# Differs from arm 2 only in the tabular table and `tabular_top_n_features: 0`
# (keep all columns — there are a few dozen, not 19,944). The table itself is a
# TRACKED input under ${paths.labels_dir}; it is not regenerated by any entry
# point.

defaults:
  - override /fusion: gated

run:
  name: er_wsi_clinpath_gated

clam:
  # data and task
  task: tcga_brca_er
  embed_dim: 1536
  results_dir: ${paths.results_root}/er

  # identity
  exp_code: er_wsi_clinpath_gated

  # optimisation
  max_epochs: 50
  k: 10
  seed: 1
  early_stopping: true
  patience: 5
  weighted_sample: true
  log_data: true
  drop_out: 0.5
  opt: adam
  lr: 1e-4
  reg: 2.5e-6

  # model
  model_type: clam_mb
  model_size: big
  B: 4
  bag_loss: ce
  no_inst_cluster: true

  # second modality: clinicopathological variables, all columns kept
  tabular_csv: ${paths.labels_dir}/tcga_brca_clinicopath_clam.csv
  tabular_case_id_col: case_id
  tabular_hidden_dim: 256
  tabular_num_layers: 2
  tabular_top_n_features: 0
  fusion_hidden_dim: 32

  # frozen WSI branch, from arm 1 at this seed
  pretrained_wsi_ckpt: ${paths.results_root}/er/er_wsi_alone_s${clam.seed}/s_{fold}_checkpoint.pt
  freeze_wsi_branch: true

  # tracking (CLAM's own flags)
  wandb: true
  wandb_project: er-brca-ablation
  wandb_tags: [er, wsi-clinpath, gated, frozen]
