# The only place a filesystem location is written down.
#
# Every machine-specific root reads an environment variable with a
# repository-relative default, so a clean clone works with no `.env` at all and a
# cluster install works by setting three variables (DP_DATA_ROOT,
# DP_SCRATCH_ROOT, DP_RESULTS_ROOT). See `.env.example`.
#
# `${dp.repo_root:}` is registered by `dpcode/paths.py`. Interpolations inside
# this file are RELATIVE (`${.key}`) so the group stays self-contained and can be
# relocated with a package override without rewriting every key.
#
# Everything resolves to an absolute path; `dpcode.paths.assert_paths_absolute`
# enforces that at startup.

repo_root: ${oc.env:DP_REPO_ROOT,${dp.repo_root:}}
data_root: ${oc.env:DP_DATA_ROOT,${.repo_root}/.datasets}
scratch_root: ${oc.env:DP_SCRATCH_ROOT,${.repo_root}/.scratch}
results_root: ${oc.env:DP_RESULTS_ROOT,${.scratch_root}/results}

# --- Tracked inputs. NEVER regenerated by any entry point. ------------------
# These carry the exact fold assignments and manifests behind every published
# number, they have no recorded derivation, and regenerating them with a
# different seed would invalidate pam50_final_s1, ensemble_predictions.csv, all
# five ladder runs and the headline table.
clam_root: ${.repo_root}/project/CLAM
splits_root: ${.clam_root}/splits
dataset_csv_dir: ${.clam_root}/dataset_csv
labels_dir: ${.repo_root}/tools/data

# --- Cohort features and derived tables -------------------------------------
tcga_embeddings: ${.data_root}/tcga-brca/embeddings
cptac_embeddings: ${.data_root}/cptac-brca/embeddings
cptac_root: ${.data_root}/cptac-brca
cnv_dir: ${.data_root}/cnv
cnv_reference_dir: ${.cnv_dir}/reference
cnv_tabular_dir: ${.scratch_root}/cnv-tabular
cptac_validation_dir: ${.scratch_root}/cptac_validation
analysis_dir: ${.scratch_root}/analysis
harmonisation_dir: ${.scratch_root}/harmonisation
rna_gdc_dir: ${.scratch_root}/rna-gdc
rna_legacy_dir: ${.scratch_root}/TCGA-BRCA-rna
uni_checkpoint_dir: ${.scratch_root}/checkpoints/uni2-h

# --- Parked cohorts ----------------------------------------------------------
hsi_bc_root: ${oc.env:DP_HSI_BC_ROOT,${.data_root}/HistologyHSI-BC-Recurrence}
nou_root: ${oc.env:DP_NOU_ROOT,null}
