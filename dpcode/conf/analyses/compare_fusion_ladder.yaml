# @package analysis
#
# Compare the five trained fusion operators against the WSI-only model and the probability mean.
#
# NOTE the directory name. This group's OPTIONS live in `dpcode/conf/analyses/` while the config
# key they populate is `analysis`, because `.gitignore:74` is a bare `analysis` pattern, which
# matches a directory of that name at any depth — `dpcode/conf/analysis/` could never have been
# committed and a fresh clone would have failed to compose. Same trap as the `wandb` group in
# DESIGN-ADDENDUM A2, same remedy: `.gitignore` is left untouched and the directory is renamed.
# The `# @package analysis` line MUST stay on line 1 — Hydra only reads the directive from the
# very first line — and it is what keeps the config key unchanged, so every override is still
# spelled `analysis.<key>=…`.
#
# Dispatches tools/compare_fusion_ladder.py as a SUBPROCESS. That script is the thesis author's
# live work and is not edited by this refactor; it already anchors every path on `Path(__file__)`,
# so it runs correctly from any working directory, and launching rather than importing it keeps
# its `from pam50_arms import ...` resolving exactly as it does when run by hand.
#
# It reads .scratch/results/<run_pattern with {mode} substituted> for the five ladder arms; the
# default is the five completed runs, which cost about 2h38m of GPU time and live in a gitignored
# tree. Nothing here writes into them.
#
# The published verdict: every trained operator loses to the untrained equal-weight mean, five
# operators ensembled still lose to two independently trained ones, and the mechanism is error
# correlation (phi 0.656 among the operators, 0.193 between the two unimodal arms).

action: compare_fusion_ladder

# The script's bootstrap size. Its seed (13) is fixed inside the script.
n_boot: 2000

# Which run directories under .scratch/results hold the ladder, one per operator; `{mode}` is
# substituted with concat/gated/cross_attention/film_attention/coattn. Missing dirs are skipped by
# the script, not an error.
#
# A value containing `{` MUST be quoted on the command line — Hydra's grammar rejects a bare `{`,
# the same trap CLAUDE.md documents for `{fold}`:
#   dp-analysis compare_fusion_ladder 'analysis.run_pattern="pam50_wsi_cnv_matched_{mode}_s1"'
run_pattern: pam50_wsi_cnv_{mode}_s1

# Optional second pattern. When set, every operator loaded from `run_pattern` is additionally
# paired-bootstrapped (same resamples) against its counterpart here, which answers "Δ vs the
# original rounded-recipe run of the same operator" beside the usual Δ vs the mean. Quote it the
# same way:
#   dp-analysis compare_fusion_ladder 'analysis.compare_to="pam50_wsi_cnv_{mode}_s1"'
compare_to: null
