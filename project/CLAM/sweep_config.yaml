program: sweep_train.py
method: bayes
metric:
  name: final/val_auc
  goal: maximize
parameters:
  lr:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.001
  reg:
    distribution: log_uniform_values
    min: 0.0005
    max: 0.01
  drop_out:
    values: [0.25, 0.5, 0.6, 0.75]
  model_type:
    values: [clam_sb, clam_mb]
  model_size:
    values: [small, big]
  bag_weight:
    distribution: uniform
    min: 0.7
    max: 0.95
  B:
    values: [4, 8, 16]
  inst_loss:
    value: svm
  patience:
    values: [3, 5, 7]
